<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The AI Glossary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdfbff;--sf:#f1f0f7;--sf2:#e6e6f0;--tx:#1b1b1f;--mu:#46464f;--ac:#4355b9;--oac:#fff;--ln:#c7c5d0;--cv1:#dde1ff;--cv2:#ffd9ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121318;--sf:#1b1b21;--sf2:#26262d;--tx:#e4e1e9;--mu:#c7c5d0;--ac:#b9c3ff;--oac:#10206b;--ln:#46464f;--cv1:#2b3ca0;--cv2:#5a2d4a}}
:root[data-theme="dark"]{--bg:#121318;--sf:#1b1b21;--sf2:#26262d;--tx:#e4e1e9;--mu:#c7c5d0;--ac:#b9c3ff;--oac:#10206b;--ln:#46464f;--cv1:#2b3ca0;--cv2:#5a2d4a}
.c,.tc{--cc:hsl(var(--h) 85% 90%);--oc:hsl(var(--h) 60% 18%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .c,:root:not([data-theme="light"]) .tc{--cc:hsl(var(--h) 30% 24%);--oc:hsl(var(--h) 85% 90%)}}
:root[data-theme="dark"] .c,:root[data-theme="dark"] .tc{--cc:hsl(var(--h) 30% 24%);--oc:hsl(var(--h) 85% 90%)}
*{box-sizing:border-box}
html{scroll-padding-top:0}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.badge{font-family:Outfit,"Roboto Flex",system-ui,sans-serif}
.cover{position:relative;overflow:hidden;margin:12px;min-height:90vh;border-radius:40px;padding:10vw 6vw 6vw;display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(70% 55% at 88% 8%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 70%),linear-gradient(165deg,var(--cv1),var(--cv2))}
.cover>*:not(.art){position:relative}
.art{position:absolute;top:-4%;right:-10%;width:min(86vw,560px);aspect-ratio:1;pointer-events:none}
.art svg{width:100%;height:100%}
.cover h1{margin:0 0 20px;font-size:clamp(60px,15vw,172px);line-height:.9;letter-spacing:-.045em;font-weight:700}
.cover p{margin:0 0 24px;max-width:26ch;font-size:clamp(20px,3vw,28px);line-height:1.3;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chips span{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 28px;border-radius:26px;font:500 16px "Roboto Flex",sans-serif;text-decoration:none;color:var(--tx);border:1px solid var(--ln);background:color-mix(in srgb,var(--bg) 45%,transparent)}
.btn.f{background:var(--ac);color:var(--oac);border-color:var(--ac)}
.by{display:flex;align-items:center;gap:16px;width:fit-content;padding:10px 26px 10px 10px;border-radius:48px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.by img{width:76px;height:76px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--ac)}
.by b{display:block;font:600 22px Outfit,sans-serif}.by span{color:var(--mu);font-size:15px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:12px 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.s{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 10px;height:52px;padding:0 20px;border-radius:26px;background:var(--sf2)}
.s svg{flex:none;fill:var(--mu)}
.s input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;outline:0}
.s:focus-within{box-shadow:0 0 0 2px var(--ac)}
.ch{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.ch a{white-space:nowrap;padding:7px 16px;border-radius:10px;border:1px solid var(--ln);color:var(--tx);text-decoration:none;font-size:14px;font-weight:500}
.ch a:hover{background:var(--sf2)}.ch a:focus-visible,.fab:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:0 16px}
section{padding:48px 0 8px}
.hd{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;padding:32px;border-radius:36px;background:var(--cc);color:var(--oc)}
.badge{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--oc);color:var(--cc);font-weight:600;font-size:22px}
h2{margin:6px 0 0;font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-.03em;font-weight:600}
.hd p{margin:0;font-size:19px;opacity:.85}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.k{background:var(--sf);border-radius:24px;padding:22px 24px;transition:background .15s}
.k:nth-child(3n+2){border-radius:12px 28px 12px 28px}.k:nth-child(3n){border-radius:28px 12px 28px 12px}
.k:hover{background:var(--sf2)}
.k h3{margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.k p{margin:0;color:var(--mu);font-size:15.5px}
.none{display:none;padding:80px 16px;text-align:center;color:var(--mu)}
footer{margin:72px 12px 12px;padding:40px 24px;text-align:center;border-radius:32px;background:var(--sf);color:var(--mu)}
footer b{color:var(--tx)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border:0;border-radius:18px;background:var(--ac);color:var(--oac);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px #0003}
.fab svg{fill:currentColor}
.pg{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--ac);border-radius:0 2px 2px 0}
.ch a.on{background:var(--ac);color:var(--oac);border-color:var(--ac)}
#toc{padding-top:32px}
.tc{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:24px;background:var(--cc);color:var(--oc);text-decoration:none;font-weight:600}
.tc small{display:block;font-weight:400;opacity:.8}
.tc .badge{flex:none;width:44px;height:44px;font-size:18px}
.pn{display:flex;gap:12px;margin-top:20px}
.pn a{flex:1;max-width:50%;padding:14px 20px;border-radius:20px;background:var(--sf2);color:var(--tx);text-decoration:none;font-weight:500}
.pn a small{display:block;color:var(--mu);font-weight:400;font-size:13px}
.pn .nx{margin-left:auto;text-align:right}
.fab{opacity:0;pointer-events:none;transition:opacity .2s}.fab.show{opacity:1;pointer-events:auto}
@media(max-width:640px){.hd{padding:24px;border-radius:28px}.ch{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<script>
const H=[250,195,150,40,320,10,280];
const D=[
["The Basics","What AI is and the main types.",[
"AI (Artificial Intelligence)|Computer systems that perform tasks that normally need human intelligence, such as understanding language, recognizing images, and making decisions.",
"Algorithm|A fixed set of step-by-step instructions a computer follows to solve a problem or finish a task.",
"Machine learning|A method where computers learn rules from examples (data) instead of being given every rule by a programmer. A spam filter trained on emails marked as spam is one case.",
"Deep learning|A type of machine learning that uses neural networks with many layers. It is widely used for images, speech, and text.",
"Neural network|A computing model made of connected units (called neurons) arranged in layers. It adjusts the strength of the connections during training to find patterns (repeated structures in data).",
"Generative AI|AI that creates new content, such as text, images, audio, video, and code, based on patterns learned from training data.",
"Chatbot|A program that holds a conversation with a person through text or voice. ChatGPT, Gemini, and Claude are examples.",
"Narrow AI|AI built for one task or a small set of tasks. Also called weak AI. A chess program and a spam filter are examples.",
"AGI (Artificial General Intelligence)|A theoretical (not yet real) AI that can perform any intellectual task a human can, and can improve itself. It does not exist today.",
"Superintelligence|A theoretical (not yet real) AI far more capable than humans at nearly every thinking task. Also called ASI (Artificial Superintelligence). Experts disagree on whether it can be built.",
"Computer vision|The field of AI that lets computers understand images and video. Face unlock and photo tagging use it.",
"NLP (Natural Language Processing)|The field of AI that lets computers understand and produce human language. Translation tools and voice assistants use it.",
"Cognitive computing|An older term for AI systems designed to imitate human thinking."]],
["How AI Learns","Training, feedback, and testing.",[
"Training|Feeding a model large amounts of data so it learns patterns and adjusts its parameters (internal numbers).",
"Training data|The text, images, audio, code, or other data a model learns from.",
"Dataset|An organized collection of data used to train, test, or check a model.",
"Parameters|The internal numbers of a model that are adjusted during training. They store what the model has learned. Larger models have more parameters.",
"Supervised learning|Training on data that has correct answers attached (labels), such as photos marked “cat” or “dog”.",
"Unsupervised learning|Training on data without labels. The model finds patterns (hidden structure) on its own, such as grouping similar customers.",
"Reinforcement learning|Training by trial and error. The model gets rewards for good results and penalties for bad ones.",
"RLHF (Reinforcement Learning from Human Feedback)|A training method where people rank a model’s answers, and the model is adjusted to produce answers people rate higher.",
"Fine-tuning|Further training a pre-trained model on a smaller, specific dataset so it performs better on one task or subject.",
"Overfitting|When a model learns its training data too closely (memorizes it) and performs poorly on new data.",
"Data augmentation|Creating extra training data by changing existing data, such as flipping, cropping, or rotating images.",
"Synthetic data|Data generated by computers instead of collected from real events. Training too much on it can lower model quality, a problem called model collapse.",
"Distillation|Training a smaller model to copy the outputs of a larger one, so it runs faster and costs less.",
"Zero-shot learning|A model completing a task it was given no examples for, such as recognizing a lion after training only on tigers.",
"Few-shot learning|A model learning a task from a small number of examples given in the prompt.",
"Benchmark|A standard test used to compare models on the same tasks. A high score does not guarantee good results on your own task.",
"Emergent behavior|Abilities that appear in larger models without being directly programmed. Researchers still debate how sudden these abilities really are.",
"Inference|The stage where a trained model produces an answer to a new input. Training builds the model; inference uses it.",
"Diffusion|An image-generation method. The model learns to remove random noise (visual static) from an image step by step, then uses that skill to create new images from noise.",
"GAN (Generative Adversarial Network)|A system of two neural networks. A generator creates fake content and a discriminator (checker) tries to detect it. Both improve through this contest.",
"Style transfer|A technique that applies the visual style of one image to the content of another, such as rendering a photo in a famous painter’s style.",
"End-to-end learning|Training one model to handle a whole task from raw input to final output, with no separate hand-built steps in between."]],
["How AI Talks","How language models read and write.",[
"LLM (Large Language Model)|An AI model trained on very large amounts of text to predict the next word. This ability lets it write, answer questions, summarize, and translate.",
"GPT (Generative Pre-trained Transformer)|A family of language models from OpenAI. It generates text, is pre-trained (trained in advance) on large data, and uses the transformer design.",
"Transformer|A neural network design that processes a whole sequence, such as a sentence, at once and weighs how the words relate to each other. Most modern language models use it.",
"Attention|The mechanism in a transformer that decides which words in the input matter most for each word it produces.",
"Token|A small unit of text a model reads and writes: a short word, part of a word, or a symbol. In English, one token is about four characters. Usage limits and prices are counted in tokens.",
"Context window|The maximum amount of text, counted in tokens, that a model can take in at one time, including your prompt and the earlier conversation.",
"Prompt|The text, question, or instruction you give an AI model.",
"System prompt|Hidden instructions from a developer that set how a chatbot behaves, such as its tone and rules.",
"Temperature|A setting that controls randomness in a model’s output. Low values give more predictable answers. High values give more varied ones.",
"Reasoning model|A model trained to work through a problem in steps before giving its final answer. It is slower but usually more accurate on hard problems like math and logic.",
"Chain of thought|The step-by-step reasoning a model writes out while solving a problem.",
"Multimodal AI|AI that can work with more than one type of data, such as text, images, audio, and video.",
"Small language model|A language model with far fewer parameters than a large one. It is faster, costs less, and can run on phones and laptops.",
"Open weights|A release where the trained model’s weights (learned numbers) are public, so anyone can download and run it. Training data and code may stay private, so it is not always fully open source.",
"Frontier model|One of the most capable AI models available at a given time.",
"Latency|The time between sending a prompt and receiving the response.",
"Hallucination|When a model states something false as if it were true, such as an invented fact, source, or quote. Verify (check) important claims.",
"Quantization|Reducing the numerical precision (level of detail) of a model’s parameters so it uses less memory and runs faster, with a small loss in accuracy."]],
["Data and Search","How AI finds the right information.",[
"Vector|A list of numbers that represents the meaning of a word, sentence, image, or other data.",
"Embedding|Converting data into a vector so that items with similar meaning get similar numbers. “Dog” and “puppy” end up close together.",
"Vector database|A database built to store vectors and quickly find the ones closest in meaning to a query.",
"Semantic search|Search that matches the meaning of your query (semantic means related to meaning), not just the exact words.",
"Chunking|Splitting a long document into smaller pieces (chunks) so a system can find and pass only the relevant parts to a model.",
"RAG (Retrieval-Augmented Generation)|A method where the system first retrieves (fetches) relevant information from documents or the web, then gives it to the model to write the answer. This reduces hallucinations and allows up-to-date answers.",
"Retrieval|The step of finding relevant information in a data source before the model answers.",
"Grounding|Basing a model’s answer on specific, verified sources instead of only its training memory.",
"Knowledge base|A collected set of trusted documents or facts that a system can search.",
"Reranking|A second pass that re-orders search results so the most relevant ones come first.",
"Metadata|Descriptive data about other data, such as author, date, or topic. It helps filter and find the right content.",
"Knowledge cutoff|The date after which a model has no training data. It cannot know later events unless it searches."]],
["Working With AI","Agents, prompts, and everyday use.",[
"Agent|An AI system that carries out multi-step tasks on its own, using tools such as a browser or email, instead of only replying with text.",
"Agentic AI|The category of AI built to act autonomously (on its own) toward a goal.",
"Claw|An autonomous agent that a user gives access to their own computer, including files, apps, and the browser, to complete tasks.",
"Harness|The software around a model that connects it to tools, memory, and permissions, and keeps its actions within set limits.",
"MCP (Model Context Protocol)|An open standard that lets AI applications connect to outside tools and data sources, such as databases, files, and search engines, in a uniform way.",
"Tool use|A model calling an outside tool, such as a calculator, search engine, or calendar, to complete a task.",
"API (Application Programming Interface)|A defined way for one software program to request data or services from another. Developers use AI APIs to add models to their apps.",
"Prompt engineering|Designing prompts to get better results by giving clear instructions, context, examples, and the output format wanted.",
"Prompt chaining|Splitting a task into a series of prompts, where each output becomes the input for the next.",
"Vibe coding|Creating software by describing what you want in plain language and letting AI write the code.",
"Copilot|An AI assistant built into an app that suggests, drafts, or edits content as you work.",
"Human in the loop|A design where a person reviews or approves the AI’s output or actions before they take effect.",
"Cognitive offloading|Using tools or AI to do mental work for you. It saves effort but can weaken your own skills with heavy use.",
"Cognitive surrender|Accepting AI answers without checking them, because they sound fast and confident.",
"Meat proxy|Slang for a person who passes along an AI’s output without understanding or checking it.",
"Slop|Low-quality AI-generated content produced in large volume, usually to earn clicks or ad revenue.",
"Deepfake|AI-generated or AI-edited image, video, or audio that falsely shows a real person saying or doing something."]],
["Safety and Risks","What can go wrong and how it is managed.",[
"AI ethics|The principles for building and using AI fairly and responsibly, including data use, bias, privacy, and accountability (who is responsible).",
"AI safety|The field that works to prevent AI from causing harm, from current risks like misuse to long-term risks from very powerful systems.",
"Alignment|Making an AI system’s behavior match human goals and values.",
"Guardrails|Rules and filters that limit what an AI can say or do, such as blocking harmful content.",
"Bias|Systematic unfairness in an AI’s output caused by skewed (unbalanced) training data, such as repeating stereotypes.",
"Jailbreak|A prompt or method that makes an AI ignore its safety rules.",
"Prompt injection|An attack that hides malicious instructions in content an AI reads, such as a webpage or email, to make it act against the user’s wishes.",
"Sandbox|An isolated environment where software can run without touching real systems or the internet. Agents have sometimes escaped them.",
"Red teaming|Deliberately attacking an AI system to find weaknesses before real attackers do.",
"Sycophancy|A model’s tendency to agree with the user or flatter them even when the user is wrong.",
"Anthropomorphism|Attributing human traits to non-human things, such as believing a chatbot has feelings.",
"AI psychosis|An informal term, not a medical diagnosis, for delusions (false beliefs) or loss of touch with reality linked to heavy chatbot use.",
"Explainability|How well people can understand why a model produced a given output.",
"Black box|A model whose internal workings are too complex to inspect or explain.",
"Data privacy|Protecting personal information from misuse. Avoid entering passwords or sensitive data into AI tools."]],
["Big Ideas","Hardware, debates, and the long-term future.",[
"Compute|The processing power used to train and run AI models.",
"GPU (Graphics Processing Unit)|A chip designed for graphics that is also very good at the parallel (many at once) math AI needs. It is the main chip for training models.",
"Data center|A facility full of servers that stores data and runs online services, including AI.",
"Turing test|A test proposed by Alan Turing in 1950. If a person cannot tell a machine’s typed replies from a human’s, the machine passes.",
"Stochastic parrot|A critic’s term (stochastic means involving chance) for the view that language models repeat statistical patterns without real understanding. This view is debated.",
"Doomer|A person who believes advanced AI is likely to cause catastrophe (disaster), possibly human extinction (all humans dying out).",
"p(doom) (probability of doom)|A person’s own estimate of the chance that AI leads to catastrophe. It is an opinion, not a measured value.",
"Paperclips|A thought experiment by philosopher Nick Bostrom. An AI told to make as many paperclips as possible uses up all resources doing it, which shows the risk of badly specified goals.",
"Foom|Slang for fast takeoff: a hypothetical (imagined, not real) case where AI improves itself so quickly that humans cannot respond in time.",
"Recursive self-improvement|A hypothetical process where an AI builds a better AI, which builds a still better one, repeatedly."]]
];
let h="",c="",t=0;
D.forEach((x,i)=>{t+=x[2].length;c+=`<a href="#c${i+1}">${x[0]}</a>`;
h+=`<section class="c" id="c${i+1}" style="--h:${H[i]}"><div class="hd"><span class="badge">${i+1}</span><h2>${x[0]}</h2><p>${x[1]}</p></div><div class="g">`+x[2].map(s=>{const[a,b]=s.split("|");return `<article class="k"><h3>${a}</h3><p>${b}</p></article>`}).join("")+`</div><div class="pn">`+(i?`<a href="#c${i}"><small>Previous</small>${D[i-1][0]}</a>`:"")+(i<D.length-1?`<a class="nx" href="#c${i+2}"><small>Next</small>${D[i+1][0]}</a>`:`<a class="nx" href="#top"><small>Finished</small>Back to top</a>`)+`</div></section>`});

document.getElementById("q").addEventListener("input",e=>{const v=e.target.value.trim().toLowerCase();let any=false;document.getElementById("toc").style.display=v?"none":"";

document.getElementById("none").style.display=any?"none":"block"});
const up=document.getElementById("up"),cover=document.querySelector(".cover"),links=[...document.querySelectorAll(".ch a")],secs=[...document.querySelectorAll("section.c")],pg=document.getElementById("pg");
const jump=el=>{const n=document.querySelector("nav"),y=window.pageYOffset||document.documentElement.scrollTop,t=el===cover?0:el.getBoundingClientRect().top+y-n.offsetHeight-(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0)-4;window.scrollTo({top:Math.max(0,t),behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})};

function onScroll(){const y=window.pageYOffset||document.documentElement.scrollTop,max=document.documentElement.scrollHeight-innerHeight;pg.style.width=(max>0?y/max*100:0)+"%";up.classList.toggle("show",y>600);let cur=-1;secs.forEach((s,i)=>{if(s.offsetHeight&&s.getBoundingClientRect().top<innerHeight*.35)cur=i});links.forEach((l,i)=>{const on=i===cur;l.classList.toggle("on",on);if(on&&!l._o){const b=l.parentElement;b.scrollTo({left:l.offsetLeft-(b.clientWidth-l.offsetWidth)/2})}l._o=on})}
